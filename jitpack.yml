# JitPack packaging for kotlogramme.
#
# JitPack's default behaviour is to build this repository from source, which cannot produce a usable
# artifact here: JitPack runs Linux x86_64 only, so at most one of the six bundled native libraries
# could be produced, and the native crate's grammers dependencies are git dependencies on codeberg that
# a source build would have to fetch and compile inside JitPack's timeout. The jar CI builds carries all
# six natives, so this file downloads that jar from the GitHub Release for the tag being built and
# installs it into JitPack's local Maven repository instead of compiling anything.
#
# JitPack supplies GROUP, ARTIFACT and VERSION as environment variables. They are derived from the
# repository name, so a consumer writes `com.github.J0s3f:kotlogram:<version>` - see docs/publishing.md.
#
# Things about those variables learned from failed builds rather than assumed:
#
#   * VERSION is the whole tag, so it arrives as `v0.9.1`, not `0.9.1`. It is stripped below, because
#     the GitHub Release is tagged `v0.9.1` while the Maven coordinate is `0.9.1`. Without the strip the
#     downloads would double the v (`vv0.9.1`) and the artifact would be published as `v0.9.1`, which is
#     not the version the README tells consumers to ask for.
#   * JitPack's curl is older than 7.76, so `--fail-with-body` is unknown there and aborts the build.
#     `-f` is used instead; it has been available forever.
#   * A branch build exports VERSION as e.g. `main-SNAPSHOT`, for which no GitHub Release exists. Rather
#     than fail on a missing asset, the build falls back to a released version's jar (see JITPACK_FALLBACK
#     below). That makes a branch build a real test of everything on this page - the download, the native
#     check and the local install - before any tag depends on it.
#
# The release this reads from is created by the same tag push that triggers it, and the workflow runs
# publish-jitpack after github-release for that reason.

jdk:
  - openjdk21

# JitPack's own /script/buildit.sh mishandles AFTER_INSTALL_CMD, and the build ends with `Exit code: 1`
# even though the artifacts install and are served. The three behaviours, all observed in the build log:
#
#   * unset   -> `line 140: AFTER_INSTALL_CMD: unbound variable`  (it reads it without a default)
#   * "true"  -> `line 142: ${$AFTER_INSTALL_CMD}: bad substitution`  (their expansion has a typo)
#   * ""      -> the non-empty guard skips the block entirely, which is what we want
#
# So the value has to be empty rather than a no-op command. There is nothing to run after install here.
env:
  AFTER_INSTALL_CMD: ""

install:
  - |
    set -euo pipefail

    # Where the CI-built jar for a version comes from.
    release_url() {
      echo "https://github.com/J0s3f/kotlogram/releases/download/v$1/kotlogramme-$1.jar"
    }

    # Wait for a release asset to appear, because the tag push that triggers this build also triggers the
    # GitHub Actions run that *creates* the release. JitPack's scheduler can start building the tag
    # before that run has finished, so on the first attempt the asset may not exist yet. That race is
    # what failed the v0.9.2 build: it asked for the jar, got a 404, and exited before the release
    # existed a couple of minutes later.
    #
    # Polls until the asset answers, up to WAIT_ATTEMPTS * WAIT_INTERVAL_SECONDS.
    wait_for_release() {
      local version="$1" attempt
      for attempt in $(seq 1 "${WAIT_ATTEMPTS}"); do
        if curl -fsSL --head --output /dev/null "$(release_url "${version}")" 2>/dev/null; then
          return 0
        fi
        echo "attempt ${attempt}/${WAIT_ATTEMPTS}: release v${version} not published yet, waiting ${WAIT_INTERVAL_SECONDS}s"
        sleep "${WAIT_INTERVAL_SECONDS}"
      done
      return 1
    }

    # Roughly ten minutes, which is longer than the native matrix takes to finish and create the release.
    WAIT_ATTEMPTS=40
    WAIT_INTERVAL_SECONDS=15

    # The released version whose jar is used when the version being built has no release of its own,
    # which is the case for any branch build (`main-SNAPSHOT` and friends). Unlike `requested` this one
    # is not waited for: it is a release that already exists, so a failure here is a real error rather
    # than a race. Bump it when the fallback release is superseded.
    JITPACK_FALLBACK="0.9.3"

    requested="${VERSION#v}"
    source_version="${requested}"
    if ! wait_for_release "${requested}"; then
      # Either a branch build, whose version is a commit name no release will ever carry, or a tag whose
      # actions run failed. Fall back to a released version so a branch build still exercises the path.
      echo "No release found for '${requested}' after waiting; falling back to ${JITPACK_FALLBACK}"
      source_version="${JITPACK_FALLBACK}"
      wait_for_release "${source_version}"
    fi

    base="https://github.com/J0s3f/kotlogram/releases/download/v${source_version}"
    asset="${base}/kotlogramme-${source_version}.jar"

    echo "Fetching the CI-built jar from ${asset}"
    curl -fsSL --output /tmp/kotlogramme.jar "${asset}"

    # A sanity check that the artifact really carries the bundled natives. Without this the failure
    # would only surface at a consumer's runtime as UnsatisfiedLinkError.
    count="$(unzip -l /tmp/kotlogramme.jar | grep -c '^.*native/.*kotlogramme\(\.dll\|\.so\|\.dylib\)$' || true)"
    echo "bundled native libraries found: ${count}"
    test "${count}" -ge 6

    # The artifact is installed under the version JitPack asked for, not the one the jar came from, so a
    # branch build resolves as main-SNAPSHOT while still serving the fallback's bytes.
    mvn --batch-mode install:install-file \
      -Dfile=/tmp/kotlogramme.jar \
      -DgroupId="${GROUP}" \
      -DartifactId="${ARTIFACT}" \
      -Dversion="${requested}" \
      -Dpackaging=jar \
      -DgeneratePom=true

    # The detached signature is deliberately NOT mirrored into ~/.m2 here. It was tried, and the build
    # log proves JitPack does not serve it: the signature was written to
    # ~/.m2/repository/.../kotlogram-<version>.jar.asc and JitPack's own Files: listing still contained
    # only the jar, the pom and the pom's md5/sha1. JitPack publishes a fixed artifact set rather than
    # mirroring the directory, so the signature cannot travel with a JitPack artifact. It is published
    # on the GitHub Release instead, and the README tells a consumer to fetch it from there.

    repo="${HOME}/.m2/repository"
    dir="$(dirname "$(find "${repo}" -type f -name "${ARTIFACT}-${requested}.jar" -print -quit)")"
    test -n "${dir}"
    echo "installed into ${dir}:"
    ls -l "${dir}"
