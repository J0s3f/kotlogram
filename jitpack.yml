# JitPack configuration for kotlogramme.
# Downloads the multi-platform prebuilt jar and published POM from GitHub Releases
# rather than compiling native binaries inside JitPack's environment.

jdk:
  - openjdk21

# Explicit empty string prevents build failure from unbound variable in JitPack runner
env:
  AFTER_INSTALL_CMD: ""

install:
  - |
    set -euo pipefail

    release_url() {
      echo "https://github.com/J0s3f/kotlogram/releases/download/v$1/kotlogramme-$1.jar"
    }

    # Poll until release assets are available on GitHub
    wait_for_release() {
      local version="$1" attempt
      for attempt in $(seq 1 "${WAIT_ATTEMPTS}"); do
        if curl -fsSL --head --output /dev/null "$(release_url "${version}")" 2>/dev/null; then
          return 0
        fi
        echo "attempt ${attempt}/${WAIT_ATTEMPTS}: release v${version} not published yet, waiting ${WAIT_INTERVAL_SECONDS}s"
        sleep "${WAIT_INTERVAL_SECONDS}"
      done
      return 1
    }

    WAIT_ATTEMPTS=40
    WAIT_INTERVAL_SECONDS=15

    # Fallback release for branch builds (e.g., main-SNAPSHOT) where no tag release exists
    JITPACK_FALLBACK="0.9.11"

    requested="${VERSION#v}"
    source_version="${requested}"
    if ! wait_for_release "${requested}"; then
      echo "No release found for '${requested}' after waiting; falling back to ${JITPACK_FALLBACK}"
      source_version="${JITPACK_FALLBACK}"
      wait_for_release "${source_version}"
    fi

    base="https://github.com/J0s3f/kotlogram/releases/download/v${source_version}"
    asset="${base}/kotlogramme-${source_version}.jar"

    echo "Fetching the CI-built jar from ${asset}"
    curl -fsSL --output /tmp/kotlogramme.jar "${asset}"

    # Verify that all 6 native libraries are packaged
    count="$(unzip -l /tmp/kotlogramme.jar | grep -c '^.*native/.*kotlogramme\(\.dll\|\.so\|\.dylib\)$' || true)"
    echo "bundled native libraries found: ${count}"
    test "${count}" -ge 6

    # Fetch published POM to retain declared transitive dependencies
    pom_asset="${base}/kotlogramme-${source_version}.pom"
    echo "Fetching the published POM from ${pom_asset}"
    curl -fsSL --output /tmp/kotlogramme.pom "${pom_asset}"

    grep -q '<artifactId>kotlin-stdlib</artifactId>' /tmp/kotlogramme.pom
    echo "POM declares kotlin-stdlib: ok"

    # Install into local Maven repo with the requested coordinate version
    mvn --batch-mode install:install-file \
      -Dfile=/tmp/kotlogramme.jar \
      -DpomFile=/tmp/kotlogramme.pom \
      -DgroupId="${GROUP}" \
      -DartifactId="${ARTIFACT}" \
      -Dversion="${requested}" \
      -Dpackaging=jar

    repo="${HOME}/.m2/repository"
    dir="$(dirname "$(find "${repo}" -type f -name "${ARTIFACT}-${requested}.jar" -print -quit)")"
    test -n "${dir}"
    echo "installed into ${dir}:"
    ls -l "${dir}"
