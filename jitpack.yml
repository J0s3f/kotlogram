# JitPack packaging for kotlogramme.
#
# JitPack's default behaviour is to build this repository from source, which cannot produce a usable
# artifact here: JitPack runs Linux x86_64 only, so at most one of the six bundled native libraries
# could be produced, and the native crate's grammers dependencies are git dependencies on codeberg that
# a source build would have to fetch and compile inside JitPack's timeout. The jar CI builds carries all
# six natives, so this file downloads that jar from the GitHub Release for the tag being built and
# installs it into JitPack's local Maven repository instead of compiling anything.
#
# JitPack supplies GROUP, ARTIFACT and VERSION as environment variables. They are derived from the
# repository name, so a consumer writes `com.github.J0s3f:kotlogram:<version>` - see docs/publishing.md.
#
# Two things about those variables, both learned from a failed build rather than assumed:
#
#   * VERSION is the whole tag, so it arrives as `v0.9.1`, not `0.9.1`. It is stripped below, because
#     the GitHub Release is tagged `v0.9.1` while the Maven coordinate is `0.9.1`. Without the strip the
#     downloads would double the v (`vv0.9.1`) and the artifact would be published as `v0.9.1`, which is
#     not the version the README tells consumers to ask for.
#   * JitPack's curl is older than 7.76, so `--fail-with-body` is unknown there and aborts the build.
#     `-f` is used instead; it has been available forever.
#
# The release this reads from is created by the same tag push that triggers it, and the workflow runs
# publish-jitpack after github-release for that reason.

jdk:
  - openjdk21

install:
  - |
    set -euo pipefail

    version="${VERSION#v}"
    test -n "${version}"
    base="https://github.com/J0s3f/kotlogram/releases/download/v${version}"
    asset="${base}/kotlogramme-${version}.jar"

    echo "Fetching the CI-built jar from ${asset}"
    curl -fsSL --output /tmp/kotlogramme.jar "${asset}"

    # A sanity check that the artifact really carries the bundled natives. Without this the failure
    # would only surface at a consumer's runtime as UnsatisfiedLinkError.
    count="$(unzip -l /tmp/kotlogramme.jar | grep -c '^.*native/.*kotlogramme\(\.dll\|\.so\|\.dylib\)$' || true)"
    echo "bundled native libraries found: ${count}"
    test "${count}" -ge 6

    mvn --batch-mode install:install-file \
      -Dfile=/tmp/kotlogramme.jar \
      -DgroupId="${GROUP}" \
      -DartifactId="${ARTIFACT}" \
      -Dversion="${version}" \
      -Dpackaging=jar \
      -DgeneratePom=true

    # JitPack serves whatever sits in ~/.m2/repository, so placing the detached signature beside the
    # installed jar is what makes it available at kotlogram-<version>.jar.asc. JitPack does not sign
    # artifacts itself, and this is the only way the signature can sit next to the artifact rather than
    # only on the GitHub Release. The signature is public data - it is produced by CI from a key that
    # never leaves GitHub secrets - so fetching it over HTTPS leaks nothing.
    signed="${base}/kotlogramme-${version}.jar.asc"
    echo "Fetching the detached signature from ${signed}"
    curl -fsSL --output /tmp/kotlogramme.jar.asc "${signed}"

    # The path maven installed into; mirror it for the signature.
    repo="${HOME}/.m2/repository"
    dir="$(dirname "$(find "${repo}" -type f -name "${ARTIFACT}-${version}.jar" -print -quit)")"
    test -n "${dir}"
    cp /tmp/kotlogramme.jar.asc "${dir}/${ARTIFACT}-${version}.jar.asc"

    echo "installed into ${dir}:"
    ls -l "${dir}"
