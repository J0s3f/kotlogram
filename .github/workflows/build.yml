name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: native-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            library: libkotlogramme.so
          - platform: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            library: kotlogramme.dll
          - platform: macos-x86_64
            runner: macos-13
            target: x86_64-apple-darwin
            library: libkotlogramme.dylib
          - platform: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            library: libkotlogramme.dylib
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build native library
        run: cargo build --release --manifest-path native/Cargo.toml --target ${{ matrix.target }}
      - name: Stage native library
        shell: bash
        run: |
          mkdir -p "build/native/${{ matrix.platform }}"
          cp "native/target/${{ matrix.target }}/release/${{ matrix.library }}" "build/native/${{ matrix.platform }}/"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: build/native

  package:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: generated/native
          merge-multiple: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - run: gradle --no-daemon clean test jar
      - name: Verify bundled native libraries
        run: |
          jar tf kotlogramme-kotlin/build/libs/*.jar | grep -E '^native/(linux-x86_64/libkotlogramme\.so|windows-x86_64/kotlogramme\.dll|macos-x86_64/libkotlogramme\.dylib|macos-aarch64/libkotlogramme\.dylib)$'
      - uses: actions/upload-artifact@v4
        with:
          name: kotlogramme-jars
          path: kotlogramme-kotlin/build/libs/*.jar
