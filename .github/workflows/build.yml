name: build

# Three levels of effort, because the full five-platform native matrix is expensive in runner
# contention and in its dependence on fetching grammers from codeberg:
#   - a push to main runs a single Linux job, which keeps the default-branch cache warm and catches
#     regressions without building every platform;
#   - a pull request and a nightly schedule run the full matrix, so platform coverage does not depend
#     on cutting a release;
#   - a v* tag (or a manual dispatch with publish) does everything and publishes.
# Standard runners are free on public repositories, so none of this is a cost decision.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  schedule:
    # Nightly, so a platform break is found without waiting for the next release. Deliberately not
    # on the hour: GitHub's scheduler is congested at :00, so `37 3` starts closer to when it says
    # it will than `0 3` does.
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Version to build; publishing uses the tag, so this only names the artifacts
        required: false
        default: '0.0.0-dev'
        type: string
      publish:
        description: Publish to Maven Central and create the GitHub Release
        required: false
        default: false
        type: boolean
      signing-check:
        description: Verify the release signing secrets import, sign and verify, without publishing
        required: false
        default: false
        type: boolean
      as-schedule:
        description: Pretend this dispatch is the nightly, to exercise the nightly-guard skip
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # `nightly-guard` reads this workflow's own run history through the API to decide whether the
  # nightly has anything new to do.
  actions: read

jobs:
  # Decides whether the nightly has anything to do, so an unchanged main branch does not spend six
  # platform builds every night.
  #
  # This compares the ref's current commit against the commit of the last *successful* scheduled run
  # of this same workflow, through the runs API. The earlier design wrote a marker file back to the
  # repository from CI, which needed a write permission and a token to commit; this needs neither,
  # because the run history already records the baseline. A dispatch bypasses it, so the nightly can
  # always be forced by hand.
  nightly-guard:
    name: nightly-guard
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - name: Should this run do any work?
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          # This endpoint accepts a workflow's file path or its numeric id, NOT its display name -
          # `github.workflow` is the name, which resolves to a 404. `workflow_ref` is
          # `<owner>/<repo>/<path>@<ref>`, so the id is the part between the repo and the `@`.
          WORKFLOW_REF: ${{ github.workflow_ref }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          AS_SCHEDULE: ${{ inputs.as-schedule }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "schedule" ] && [ "$AS_SCHEDULE" != "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `<owner>/<repo>/.github/workflows/build.yml@<ref>` -> `build.yml`, which is the form
          # this endpoint takes. The leading `.github/workflows/` is not accepted; neither is the
          # workflow's display name.
          workflow="${WORKFLOW_REF%%@*}"; workflow="${workflow##*/}"
          echo "workflow id    : $workflow"
          # The most recent completed successful run of this workflow, whatever its event. Only one
          # baseline matters here, and a pull-request run at the same commit is just as good a record
          # that the commit built, so the filter is deliberately not `event`.
          previous="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')"
          echo "baseline commit : ${previous:-<none>}"
          echo "this commit      : $SHA"
          if [ -n "$previous" ] && [ "$previous" = "$SHA" ]; then
            echo "Nothing changed since the last successful run; skipping the nightly."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # A push to main gets one cheap job rather than the whole matrix; everything else (a pull request,
  # a nightly that has work to do, a tag or a manual dispatch) is a full run.
  check:
    name: check
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: native
          key: check
      - name: Build the native library for this host
        run: cargo build --release --manifest-path native/Cargo.toml
      - name: Stage it where Gradle expects it
        run: |
          mkdir -p generated/native/linux-x86_64
          cp native/target/release/libkotlogramme.so generated/native/linux-x86_64/
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: false
      - name: Build and test
        run: ./gradlew --no-daemon clean test

  signing-check:
    name: signing-check
    # A dispatch-only smoke test for the release signing secrets. It imports SIGNING_KEY with
    # SIGNING_PASSWORD, signs a throwaway file and verifies the signature against the exported public
    # key, which is the whole failure surface of the signing step in `github-release` - without
    # creating a release or touching Central. Run it after rotating the key so a broken secret is found
    # here rather than halfway through a tag build.
    if: github.event_name == 'workflow_dispatch' && inputs.signing-check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Import the signing key and verify a signature with it
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        shell: bash
        run: |
          test -n "$SIGNING_KEY"
          test -n "$SIGNING_PASSWORD"
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$SIGNING_KEY" | gpg --batch --quiet --import
          key="$(gpg --batch --with-colons --list-keys | awk -F: '/^fpr:/ {print $10; exit}')"
          test -n "$key"
          echo "signing key fingerprint: $key"
          # An expired or revoked key would still import, so check it can actually usably sign.
          gpg --batch --with-colons --list-keys "$key" | awk -F: '/^pub/ {print "pub validity/expiry fields: " $2 " " $7}'
          head -c 1024 /dev/urandom > /tmp/probe.bin
          gpg --batch --yes --quiet --armor --detach-sign \
            --pinentry-mode loopback --passphrase "$SIGNING_PASSWORD" \
            --output /tmp/probe.bin.asc /tmp/probe.bin
          gpg --batch --quiet --armor --export > /tmp/public.asc
          # Verify against a bare keyring holding only the exported public half, as a consumer would.
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          gpg --batch --quiet --import < /tmp/public.asc
          gpg --batch --verify /tmp/probe.bin.asc /tmp/probe.bin
          {
            echo "### Signing check passed"
            echo
            echo "The release signing key imports, signs, and verifies against its published public half."
            echo
            echo "Fingerprint: \`$key\`"
          } >> "$GITHUB_STEP_SUMMARY"

  raw-schema:
    name: raw-schema
    # Skipped on a main push, where `check` runs instead, and on a nightly with nothing new.
    needs: nightly-guard
    if: needs.nightly-guard.outputs.run == 'true' && (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
      # grammers is a git dependency on codeberg, and a failed release is normally retried on the
      # same tag. Caching the cargo home means a retry reuses the clone it already made instead of
      # going back to codeberg, which is the part that keeps failing.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: native
          key: raw-schema
          cache-targets: false
      - name: Fetch the pinned grammers schema
        run: cargo fetch --manifest-path native/Cargo.toml
      - name: Generate and verify the Layer manifest
        shell: bash
        run: |
          cargo_root="${CARGO_HOME:-$HOME/.cargo}"
          # grammers is a git dependency, so its api.tl lives under git/checkouts as
          # `grammers-tl-types` (no version suffix); registry/src is kept as a fallback.
          schema="$(find "$cargo_root/git/checkouts" "$cargo_root/registry/src" -path '*/grammers-tl-types*/tl/api.tl' -print -quit 2>/dev/null || true)"
          test -n "$schema"
          python3 tools/generate_raw_schema.py --schema "$schema" --output generated/raw-schema/telegram-layer-229.json
          cmp generated/raw-schema/telegram-layer-229.json kotlogramme-kotlin/src/main/resources/raw/telegram-layer-229.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: raw-schema
          path: generated/raw-schema/telegram-layer-229.json

  native:
    name: native-${{ matrix.platform }}
    # The matrix is the expensive part; a main push uses `check` instead, and a nightly with nothing
    # new is held back by the guard.
    needs: nightly-guard
    if: needs.nightly-guard.outputs.run == 'true' && (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu
            library: libkotlogramme.so
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu
            library: libkotlogramme.so
          - platform: windows-x86_64
            runner: windows-2025
            targets: x86_64-pc-windows-msvc
            library: kotlogramme.dll
          - platform: windows-aarch64
            runner: windows-11-arm
            targets: aarch64-pc-windows-msvc
            library: kotlogramme.dll
          - platform: macos
            runner: macos-14
            targets: x86_64-apple-darwin,aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
        with:
          targets: ${{ matrix.targets }}
      # Six platforms recompiling grammers from source is the bulk of a release, and the retry after
      # a codeberg failure re-runs the same tag ref, so it can reuse whatever the first attempt built.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: native
          key: ${{ matrix.platform }}
          cache-on-failure: true
      - name: Build native library
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            cargo build --release --manifest-path native/Cargo.toml --target x86_64-apple-darwin
            cargo build --release --manifest-path native/Cargo.toml --target aarch64-apple-darwin
          else
            cargo build --release --manifest-path native/Cargo.toml --target ${{ matrix.targets }}
          fi
      - name: Stage native library
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            mkdir -p build/native/macos-x86_64 build/native/macos-aarch64
            cp native/target/x86_64-apple-darwin/release/libkotlogramme.dylib build/native/macos-x86_64/
            cp native/target/aarch64-apple-darwin/release/libkotlogramme.dylib build/native/macos-aarch64/
          else
            mkdir -p "build/native/${{ matrix.platform }}"
            cp "native/target/${{ matrix.targets }}/release/${{ matrix.library }}" "build/native/${{ matrix.platform }}/"
          fi
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: native-${{ matrix.platform }}
          path: build/native

  package:
    # Gated with the jobs it needs: a skipped dependency skips this, so it only runs on a full build.
    needs: [nightly-guard, native, raw-schema]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-*
          path: generated/native
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: raw-schema
          path: generated/raw-schema
      - name: Verify bundled raw schema source
        run: cmp generated/raw-schema/telegram-layer-229.json kotlogramme-kotlin/src/main/resources/raw/telegram-layer-229.json
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '8.10'
          # Nothing runs on main any more, so a tag build has no warmed cache to read; letting it
          # write one means the retry of a failed release reuses what the first attempt downloaded.
          cache-read-only: false
      - name: Determine the release version
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-SNAPSHOT" >> "$GITHUB_OUTPUT"
          fi
      - run: gradle --no-daemon -Pversion="${{ steps.release.outputs.version }}" clean test jar
      - name: Verify bundled native libraries
        run: |
          jar tf kotlogramme-kotlin/build/libs/*.jar | grep -E '^native/(linux-x86_64/libkotlogramme\.so|linux-aarch64/libkotlogramme\.so|windows-x86_64/kotlogramme\.dll|windows-aarch64/kotlogramme\.dll|macos-x86_64/libkotlogramme\.dylib|macos-aarch64/libkotlogramme\.dylib)$'
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: kotlogramme-jars
          path: kotlogramme-kotlin/build/libs/*.jar

  publish-central:
    # Best effort by design. Maven Central has monthly publishing limits, and a rejection says nothing
    # about the release being wrong, so this cannot be allowed to cost the release. The GitHub Release
    # and the JitPack publish do not depend on this job succeeding.
    #
    # `package` is deliberately NOT a dependency: this job builds and publishes the jar itself with its
    # own Gradle invocation, and downloads only the native-* artifacts that `package` also consumes. So
    # it can start as soon as the natives and the schema are there, in parallel with `package` rather
    # than after it.
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [native, raw-schema]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-*
          path: generated/native
          merge-multiple: true
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: false
      - name: Publish the signed release to the Central staging API
        id: central
        # Never fails the run: the outcome is recorded and reported in the summary below.
        continue-on-error: true
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          test -n "$CENTRAL_USERNAME"
          test -n "$CENTRAL_PASSWORD"
          test -n "$SIGNING_KEY"
          test -n "$SIGNING_PASSWORD"
          test "$version" = "${version%-SNAPSHOT}"
          ./gradlew --no-daemon -Pversion="$version" :kotlogramme-kotlin:publishMavenJavaPublicationToCentralRepository
      - name: Submit the staged deployment to the Central Portal
        if: steps.central.outcome == 'success'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        shell: bash
        run: |
          authorization="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 --wrap=0)"
          curl --fail-with-body --silent --show-error --request POST --data '' \
            --header "Authorization: Bearer $authorization" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/io.github.j0s3f?publishing_type=automatic"
      - name: Report the Central outcome
        shell: bash
        run: |
          if [ "${{ steps.central.outcome }}" = "success" ]; then
            echo "### Maven Central: published" >> "$GITHUB_STEP_SUMMARY"
            echo "The release is on Central as well as JitPack." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Maven Central: NOT published"
              echo
              echo "The deployment was refused. Central enforces monthly publishing limits, so this is"
              echo "expected to happen and is not a failure of the release."
              echo
              echo "The GitHub Release and the JitPack publish completed regardless - consumers should"
              echo "use JitPack, which is the recommended channel."
              echo
              echo "See https://central.sonatype.org/publish/maven-central-publishing-limits"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  github-release:
    # Runs as soon as `package` has produced the jar and the natives. `publish-central` is deliberately
    # NOT a dependency: it is best effort, nothing here reads its outputs, and requiring it would only
    # serialize the release behind a job whose failure is already tolerated. Its outcome is reported in
    # its own job summary instead.
    if: |
      always() && !cancelled()
      && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event_name == 'workflow_dispatch' && inputs.publish))
      && needs.package.result == 'success'
    needs: [native, raw-schema, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-*
          path: dist/natives
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: kotlogramme-jars
          path: dist/jars
      - name: Stage the release assets
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          mkdir -p dist/release
          for platform in dist/natives/*/; do
            name="$(basename "$platform")"
            (cd "$platform" && zip -q -r "$GITHUB_WORKSPACE/dist/release/kotlogramme-native-$name.zip" .)
          done
          jar="$(find dist/jars -type f -name '*.jar' | head -n1)"
          cp "$jar" "dist/release/kotlogramme-$version.jar"
          ls -l dist/release
      - name: Sign the released jar
        # JitPack provides checksums but not artifact signing, so the signature is produced here and
        # shipped as an asset beside the jar. The public key goes out too, so a consumer does not have
        # to find a keyserver.
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          test -n "$SIGNING_KEY"
          test -n "$SIGNING_PASSWORD"
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$SIGNING_KEY" | gpg --batch --quiet --import
          # Detached, ASCII-armored, beside the jar.
          gpg --batch --yes --quiet --armor --detach-sign \
            --pinentry-mode loopback --passphrase "$SIGNING_PASSWORD" \
            --output "dist/release/kotlogramme-$version.jar.asc" \
            "dist/release/kotlogramme-$version.jar"
          # The public half, so a consumer can verify without a keyserver lookup.
          gpg --batch --quiet --armor --export > "dist/release/kotlogramme-$version.jar.asc.pub"
          echo "signature fingerprint: $(gpg --batch --with-colons --list-keys | awk -F: '/^fpr:/ {print $10; exit}')"
          ls -l dist/release/*.asc*
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          tag="v$version"
          gh release create "$tag" \
            --title "$tag" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            dist/release/*

  publish-jitpack:
    # JitPack's jitpack.yml downloads the jar from the GitHub Release, so this must run after that
    # release exists. It is not gated on Central: JitPack is the channel consumers are pointed at.
    if: |
      always() && !cancelled()
      && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event_name == 'workflow_dispatch' && inputs.publish))
      && needs.github-release.result == 'success'
    needs: [github-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Determine the release version
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Confirm the release the build will read from exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          # The jar and the signature jitpack.yml and consumers depend on.
          gh release view "v$version" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name' | sort
      - name: Trigger the JitPack build
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          # JitPack keys its artifact path on the TAG, not the bare version: the v0.9.0 build was served
          # at .../kotlogram/v0.9.0/kotlogram-v0.9.0.pom. `version` here is bare, so the `v` is added
          # back for the URL while the coordinate a consumer writes stays bare.
          tag="v$version"
          url="https://jitpack.io/com/github/J0s3f/kotlogram/$tag/kotlogram-$tag.pom"
          echo "requesting $url"
          # The first request triggers the build, which takes up to 15 minutes; poll generously.
          for attempt in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --location "$url" || true)"
            if [ "$code" = "200" ]; then
              echo "JitPack is serving the artifact (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code, waiting"
            sleep 20
          done
          echo "JitPack did not serve the artifact within the wait window" >&2
          echo "Build log: https://jitpack.io/com/github/J0s3f/kotlogram/$tag/build.log" >&2
          exit 1
      - name: Verify the JitPack-served jar bundles the native libraries
        # Two failures this guards against, both observed rather than imagined:
        #   * the v0.6.0 jar compiled and linked fine but carried no native/ entries, failing at a
        #     consumer's runtime with UnsatisfiedLinkError;
        #   * the v0.9.1 build failed before installing anything, because VERSION arrives as the tag and
        #     the URL doubled the v.
        # The signature is deliberately not asserted here: JitPack publishes a fixed artifact set and
        # does not serve a .jar.asc, which was tested and confirmed from the build log. The signature
        # lives on the GitHub Release and `github-release` is what produces it.
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          tag="v$version"
          base="https://jitpack.io/com/github/J0s3f/kotlogram/$tag"
          curl -fsSL --output /tmp/jitpack.jar "$base/kotlogram-$tag.jar"
          echo "served jar size: $(stat -c%s /tmp/jitpack.jar) bytes"
          count="$(unzip -l /tmp/jitpack.jar | grep -c '^.*native/.*kotlogramme\(\.dll\|\.so\|\.dylib\)$' || true)"
          echo "bundled native libraries found: $count"
          test "$count" -ge 6
          # The signature must exist as a release asset, since that is the only place it is published.
          gh release view "$tag" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name' | grep -q '^kotlogramme-.*\.jar\.asc$'
