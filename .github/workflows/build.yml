name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  schedule:
    # Run nightly at 03:37 UTC to avoid peak scheduler congestion
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Version to build; publishing uses the tag, so this only names the artifacts
        required: false
        default: '0.0.0-dev'
        type: string
      publish:
        description: Publish to Maven Central and create the GitHub Release
        required: false
        default: false
        type: boolean
      signing-check:
        description: Verify the release signing secrets import, sign and verify, without publishing
        required: false
        default: false
        type: boolean
      as-schedule:
        description: Pretend this dispatch is the nightly, to exercise the nightly-guard skip
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  # Skips scheduled builds if no new commits have landed since the last successful run
  nightly-guard:
    name: nightly-guard
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - name: Should this run do any work?
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          AS_SCHEDULE: ${{ inputs.as-schedule }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "schedule" ] && [ "$AS_SCHEDULE" != "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Extract workflow file name (e.g. build.yml) expected by the runs API
          workflow="${WORKFLOW_REF\%\%@*}"; workflow="${workflow##*/}"
          echo "workflow id    : $workflow"
          previous="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')"
          echo "baseline commit : ${previous:-<none>}"
          echo "this commit      : $SHA"
          if [ -n "$previous" ] && [ "$previous" = "$SHA" ]; then
            echo "Nothing changed since the last successful run; skipping the nightly."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: check
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: native
          key: check
      - name: Build the native library for this host
        run: cargo build --release --manifest-path native/Cargo.toml
      - name: Rust unit tests
        run: cargo test --manifest-path native/Cargo.toml --profile release
      - name: Stage it where Gradle expects it
        run: |
          mkdir -p generated/native/linux-x86_64
          cp native/target/release/libkotlogramme.so generated/native/linux-x86_64/
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: false
      - name: Build and test
        run: ./gradlew --no-daemon clean test

  signing-check:
    name: signing-check
    if: github.event_name == 'workflow_dispatch' && inputs.signing-check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Import the signing key and verify a signature with it
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        shell: bash
        run: |
          test -n "$SIGNING_KEY"
          test -n "$SIGNING_PASSWORD"
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$SIGNING_KEY" | gpg --batch --quiet --import
          key="$(gpg --batch --with-colons --list-keys | awk -F: '/^fpr:/ {print $10; exit}')"
          test -n "$key"
          echo "signing key fingerprint: $key"
          gpg --batch --with-colons --list-keys "$key" | awk -F: '/^pub/ {print "pub validity/expiry fields: " $2 " " $7}'
          head -c 1024 /dev/urandom > /tmp/probe.bin
          gpg --batch --yes --quiet --armor --detach-sign \
            --pinentry-mode loopback --passphrase "$SIGNING_PASSWORD" \
            --output /tmp/probe.bin.asc /tmp/probe.bin
          gpg --batch --quiet --armor --export > /tmp/public.asc
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          gpg --batch --quiet --import < /tmp/public.asc
          gpg --batch --verify /tmp/probe.bin.asc /tmp/probe.bin
          {
            echo "### Signing check passed"
            echo
            echo "The release signing key imports, signs, and verifies against its published public half."
            echo
            echo "Fingerprint: \`$key\`"
          } >> "$GITHUB_STEP_SUMMARY"

  raw-schema:
    name: raw-schema
    needs: nightly-guard
    if: needs.nightly-guard.outputs.run == 'true' && (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: native
          key: raw-schema
          cache-targets: false
      - name: Fetch the pinned grammers schema
        run: cargo fetch --manifest-path native/Cargo.toml
      - name: Generate and verify the Layer manifest
        shell: bash
        run: |
          cargo_root="${CARGO_HOME:-$HOME/.cargo}"
          schema="$(find "$cargo_root/git/checkouts" "$cargo_root/registry/src" -path '*/grammers-tl-types*/tl/api.tl' -print -quit 2>/dev/null || true)"
          test -n "$schema"
          python3 tools/generate_raw_schema.py --schema "$schema" --output generated/raw-schema/telegram-layer-229.json
          cmp generated/raw-schema/telegram-layer-229.json kotlogramme-kotlin/src/main/resources/raw/telegram-layer-229.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: raw-schema
          path: generated/raw-schema/telegram-layer-229.json

  native:
    name: native-${{ matrix.platform }}
    needs: nightly-guard
    if: needs.nightly-guard.outputs.run == 'true' && (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu
            library: libkotlogramme.so
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu
            library: libkotlogramme.so
          - platform: windows-x86_64
            runner: windows-2025
            targets: x86_64-pc-windows-msvc
            library: kotlogramme.dll
          - platform: windows-aarch64
            runner: windows-11-arm
            targets: aarch64-pc-windows-msvc
            library: kotlogramme.dll
          - platform: macos
            runner: macos-14
            targets: x86_64-apple-darwin,aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: native
          key: ${{ matrix.platform }}
          cache-on-failure: true
      - name: Build native library
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            cargo build --profile release-shipped --manifest-path native/Cargo.toml --target x86_64-apple-darwin
            cargo build --profile release-shipped --manifest-path native/Cargo.toml --target aarch64-apple-darwin
          else
            cargo build --profile release-shipped --manifest-path native/Cargo.toml --target ${{ matrix.targets }}
          fi
      - name: Stage native library
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            mkdir -p build/native/macos-x86_64 build/native/macos-aarch64
            cp native/target/x86_64-apple-darwin/release-shipped/libkotlogramme.dylib build/native/macos-x86_64/
            cp native/target/aarch64-apple-darwin/release-shipped/libkotlogramme.dylib build/native/macos-aarch64/
          else
            mkdir -p "build/native/${{ matrix.platform }}"
            cp "native/target/${{ matrix.targets }}/release-shipped/${{ matrix.library }}" "build/native/${{ matrix.platform }}/"
          fi
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: native-${{ matrix.platform }}
          path: build/native

  package:
    needs: [nightly-guard, native, raw-schema]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-*
          path: generated/native
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: raw-schema
          path: generated/raw-schema
      - name: Verify bundled raw schema source
        run: cmp generated/raw-schema/telegram-layer-229.json kotlogramme-kotlin/src/main/resources/raw/telegram-layer-229.json
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '8.10'
      - name: Determine the release version
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-SNAPSHOT" >> "$GITHUB_OUTPUT"
          fi
      - run: gradle --no-daemon -Pversion="${{ steps.release.outputs.version }}" clean test jar generatePomFileForMavenJavaPublication
      - name: Verify bundled native libraries
        run: |
          jar tf kotlogramme-kotlin/build/libs/*.jar | grep -E '^native/(linux-x86_64/libkotlogramme\.so|linux-aarch64/libkotlogramme\.so|windows-x86_64/kotlogramme\.dll|windows-aarch64/kotlogramme\.dll|macos-x86_64/libkotlogramme\.dylib|macos-aarch64/libkotlogramme\.dylib)$'
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: kotlogramme-jars
          path: |
            kotlogramme-kotlin/build/libs/*.jar
            kotlogramme-kotlin/build/publications/mavenJava/pom-default.xml

  publish-central:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [native, raw-schema]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-*
          path: generated/native
          merge-multiple: true
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: false
      - name: Publish the signed release to the Central staging API
        id: central
        continue-on-error: true
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          test -n "$CENTRAL_USERNAME"
          test -n "$CENTRAL_PASSWORD"
          test -n "$SIGNING_KEY"
          test -n "$SIGNING_PASSWORD"
          test "$version" = "${version%-SNAPSHOT}"
          ./gradlew --no-daemon -Pversion="$version" :kotlogramme-kotlin:publishMavenJavaPublicationToCentralRepository
      - name: Submit the staged deployment to the Central Portal
        if: steps.central.outcome == 'success'
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        shell: bash
        run: |
          authorization="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 --wrap=0)"
          curl --fail-with-body --silent --show-error --request POST --data '' \
            --header "Authorization: Bearer $authorization" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/io.github.j0s3f?publishing_type=automatic"
      - name: Report the Central outcome
        shell: bash
        run: |
          if [ "${{ steps.central.outcome }}" = "success" ]; then
            echo "### Maven Central: published" >> "$GITHUB_STEP_SUMMARY"
            echo "The release is on Central as well as JitPack." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Maven Central: NOT published"
              echo
              echo "The deployment was refused. Central enforces monthly publishing limits, so this is"
              echo "expected to happen and is not a failure of the release."
              echo
              echo "The GitHub Release and the JitPack publish completed regardless - consumers should"
              echo "use JitPack, which is the recommended channel."
              echo
              echo "See https://central.sonatype.org/publish/maven-central-publishing-limits"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  github-release:
    if: |
      always() && !cancelled()
      && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event_name == 'workflow_dispatch' && inputs.publish))
      && needs.package.result == 'success'
    needs: [native, raw-schema, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: native-*
          path: dist/natives
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: kotlogramme-jars
          path: dist/jars
      - name: Stage the release assets
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          mkdir -p dist/release
          for platform in dist/natives/*/; do
            name="$(basename "$platform")"
            (cd "$platform" && zip -q -r "$GITHUB_WORKSPACE/dist/release/kotlogramme-native-$name.zip" .)
          done
          jar="$(find dist/jars -type f -name '*.jar' | head -n1)"
          cp "$jar" "dist/release/kotlogramme-$version.jar"
          pom="$(find dist/jars -type f -name 'pom-default.xml' | head -n1)"
          test -n "$pom"
          cp "$pom" "dist/release/kotlogramme-$version.pom"
          grep -q '<artifactId>kotlin-stdlib</artifactId>' "dist/release/kotlogramme-$version.pom"
          echo "POM declares kotlin-stdlib: ok"
          ls -l dist/release
      - name: Sign the released jar
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          test -n "$SIGNING_KEY"
          test -n "$SIGNING_PASSWORD"
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$SIGNING_KEY" | gpg --batch --quiet --import
          gpg --batch --yes --quiet --armor --detach-sign \
            --pinentry-mode loopback --passphrase "$SIGNING_PASSWORD" \
            --output "dist/release/kotlogramme-$version.jar.asc" \
            "dist/release/kotlogramme-$version.jar"
          gpg --batch --quiet --armor --export > "dist/release/kotlogramme-$version.jar.asc.pub"
          echo "signature fingerprint: $(gpg --batch --with-colons --list-keys | awk -F: '/^fpr:/ {print $10; exit}')"
          ls -l dist/release/*.asc*
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          tag="v$version"
          gh release create "$tag" \
            --title "$tag" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            dist/release/*

  publish-jitpack:
    if: |
      always() && !cancelled()
      && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
          || (github.event_name == 'workflow_dispatch' && inputs.publish))
      && needs.github-release.result == 'success'
    needs: [github-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Determine the release version
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Confirm the release the build will read from exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          gh release view "v$version" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name' | sort
      - name: Trigger the JitPack build
        id: jitpack
        continue-on-error: true
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          tag="v$version"
          url="https://jitpack.io/com/github/J0s3f/kotlogram/$tag/kotlogram-$tag.pom"

          echo "requesting $url (this triggers the build)"
          curl -s -o /dev/null -w 'first request: HTTP %{http_code}\n' --location "$url" || true

          # Poll at 3-minute intervals (up to ~15 min) to avoid rate limiting
          for attempt in $(seq 1 6); do
            sleep 180
            code="$(curl -s -o /dev/null -w '%{http_code}' --location "$url" || true)"
            echo "check $attempt/6: HTTP $code"
            case "$code" in
              200)
                echo "JitPack is serving $tag"
                echo "serving=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              429)
                echo "  throttled; JitPack rate-limits per repository and version. Backing off."
                ;;
              404)
                echo "  not built or still building."
                ;;
              *)
                echo "  unexpected status; treating as not-yet-built and continuing."
                ;;
            esac
          done

          echo "serving=false" >> "$GITHUB_OUTPUT"
          echo "JitPack was not serving $tag within the wait window."
          echo "Build log: https://jitpack.io/com/github/J0s3f/kotlogram/$tag/build.log"
      - name: Report the JitPack outcome
        if: always() && steps.jitpack.outcome != 'skipped'
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          tag="v$version"
          {
            if [ "${{ steps.jitpack.outputs.serving }}" = "true" ]; then
              echo "### JitPack: serving \`$tag\`"
              echo
              echo "Consumers can resolve \`com.github.J0s3f:kotlogram:$version\`."
            else
              echo "### JitPack: not serving \`$tag\` yet"
              echo
              echo "The build was requested but the artifact did not appear within the wait window, either"
              echo "because the build failed or because JitPack throttled the requests."
              echo
              echo "This is **not** a failure of the release. The GitHub Release carries the complete"
              echo "artifact - the jar, its detached signature and the six native archives - and JitPack is"
              echo "a mirror of it. JitPack builds a version when it is first requested, so a consumer's"
              echo "first resolve may be slow but will trigger it."
              echo
              echo "Build log: https://jitpack.io/com/github/J0s3f/kotlogram/$tag/build.log"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the JitPack-served jar bundles the native libraries
        if: always() && steps.jitpack.outputs.serving == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          tag="v$version"
          base="https://jitpack.io/com/github/J0s3f/kotlogram/$tag"
          curl -fsSL --output /tmp/jitpack.jar "$base/kotlogram-$tag.jar"
          echo "served jar size: $(stat -c%s /tmp/jitpack.jar) bytes"
          count="$(unzip -l /tmp/jitpack.jar | grep -cE '^.*native/.*kotlogramme\.(dll|so|dylib)$' || true)"
          echo "bundled native libraries found: $count"
          test "$count" -ge 6
          gh release view "$tag" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name' | grep -q '^kotlogramme-.*\.jar\.asc$'
