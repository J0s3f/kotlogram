name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish, without the v prefix
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  raw-schema:
    name: raw-schema
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch the pinned grammers schema
        run: cargo fetch --manifest-path native/Cargo.toml
      - name: Generate and verify the Layer manifest
        shell: bash
        run: |
          schema="$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -path '*/grammers-tl-types-*/tl/api.tl' -print -quit)"
          test -n "$schema"
          python3 tools/generate_raw_schema.py --schema "$schema" --output generated/raw-schema/telegram-layer-216.json
          cmp generated/raw-schema/telegram-layer-216.json kotlogramme-kotlin/src/main/resources/raw/telegram-layer-216.json
      - uses: actions/upload-artifact@v4
        with:
          name: raw-schema
          path: generated/raw-schema/telegram-layer-216.json

  native:
    name: native-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu
            library: libkotlogramme.so
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu
            library: libkotlogramme.so
          - platform: windows-x86_64
            runner: windows-2025
            targets: x86_64-pc-windows-msvc
            library: kotlogramme.dll
          - platform: windows-aarch64
            runner: windows-11-arm
            targets: aarch64-pc-windows-msvc
            library: kotlogramme.dll
          - platform: macos
            runner: macos-14
            targets: x86_64-apple-darwin,aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - name: Build native library
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            cargo build --release --manifest-path native/Cargo.toml --target x86_64-apple-darwin
            cargo build --release --manifest-path native/Cargo.toml --target aarch64-apple-darwin
          else
            cargo build --release --manifest-path native/Cargo.toml --target ${{ matrix.targets }}
          fi
      - name: Stage native library
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            mkdir -p build/native/macos-x86_64 build/native/macos-aarch64
            cp native/target/x86_64-apple-darwin/release/libkotlogramme.dylib build/native/macos-x86_64/
            cp native/target/aarch64-apple-darwin/release/libkotlogramme.dylib build/native/macos-aarch64/
          else
            mkdir -p "build/native/${{ matrix.platform }}"
            cp "native/target/${{ matrix.targets }}/release/${{ matrix.library }}" "build/native/${{ matrix.platform }}/"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: build/native

  package:
    needs: [native, raw-schema]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: generated/native
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: raw-schema
          path: generated/raw-schema
      - name: Verify bundled raw schema source
        run: cmp generated/raw-schema/telegram-layer-216.json kotlogramme-kotlin/src/main/resources/raw/telegram-layer-216.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - run: gradle --no-daemon clean test jar
      - name: Verify bundled native libraries
        run: |
          jar tf kotlogramme-kotlin/build/libs/*.jar | grep -E '^native/(linux-x86_64/libkotlogramme\.so|linux-aarch64/libkotlogramme\.so|windows-x86_64/kotlogramme\.dll|windows-aarch64/kotlogramme\.dll|macos-x86_64/libkotlogramme\.dylib|macos-aarch64/libkotlogramme\.dylib)$'
      - uses: actions/upload-artifact@v4
        with:
          name: kotlogramme-jars
          path: kotlogramme-kotlin/build/libs/*.jar

  publish-central:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    needs: [native, raw-schema, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: generated/native
          merge-multiple: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish the signed release to the Central staging API
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          test -n "$CENTRAL_USERNAME"
          test -n "$CENTRAL_PASSWORD"
          test -n "$SIGNING_KEY"
          test -n "$SIGNING_PASSWORD"
          test "$version" = "${version%-SNAPSHOT}"
          ./gradlew --no-daemon -Pversion="$version" :kotlogramme-kotlin:publishMavenJavaPublicationToCentralRepository
      - name: Submit the staged deployment to the Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        shell: bash
        run: |
          authorization="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 --wrap=0)"
          curl --fail-with-body --silent --show-error --request POST --data '' \
            --header "Authorization: Bearer $authorization" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/io.github.j0s3f?publishing_type=automatic"
