name: probe-guard

# Throwaway: does hashFiles() see the last-successful-run marker on a scheduled run?
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: what does hashFiles see before the marker exists?
        run: |
          echo "hash=[${{ hashFiles('.github/nightly-baseline') }}]"
          echo "is-empty=${{ hashFiles('.github/nightly-baseline') == '' }}"
      - name: touch the marker for the next run to find
        run: |
          touch .github/nightly-baseline
          ls -la .github/nightly-baseline