name: cleanup-failed-central-deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drop-failed-deployment:
    runs-on: ubuntu-24.04
    steps:
      - name: Drop the single failed Portal deployment and its staging repository
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CENTRAL_USERNAME"
          test -n "$CENTRAL_PASSWORD"

          authorization="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 --wrap=0)"
          search_url="https://ossrh-staging-api.central.sonatype.com/manual/search/repositories?ip=any&profile_id=io.github.j0s3f"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $authorization" \
            "$search_url" > repositories.json

          candidate="$(jq --exit-status --compact-output '
            [.repositories[] | select(.state == "closed" and ((.portal_deployment_id // "") != ""))]
            | if length == 1 then .[0]
              else error("Expected exactly one closed repository with a Portal deployment; found \(length).")
              end
          ' repositories.json)"
          repository_key="$(jq --raw-output '.key' <<< "$candidate")"
          deployment_id="$(jq --raw-output '.portal_deployment_id' <<< "$candidate")"

          curl --fail-with-body --silent --show-error --request POST --data '' \
            --header "Authorization: Bearer $authorization" \
            "https://central.sonatype.com/api/v1/publisher/status?id=$deployment_id" > deployment-status.json
          test "$(jq --raw-output '.deploymentState' deployment-status.json)" = "FAILED"

          echo "Dropping failed Portal deployment: $deployment_id"
          curl --fail-with-body --silent --show-error --request DELETE \
            --header "Authorization: Bearer $authorization" \
            "https://central.sonatype.com/api/v1/publisher/deployment/$deployment_id"
          echo "Dropping staging repository: $repository_key"
          curl --fail-with-body --silent --show-error --request DELETE \
            --header "Authorization: Bearer $authorization" \
            "https://ossrh-staging-api.central.sonatype.com/manual/drop/repository/$repository_key"
