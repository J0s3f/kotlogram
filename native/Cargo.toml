[package]
name = "kotlogramme"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "JNI bridge between Kotlin/JVM and the grammers Telegram client"
repository = "https://codeberg.org/kotlogramme/kotlogramme"

[lib]
crate-type = ["cdylib"]

[dependencies]
# grammers is developed on its codeberg repository and releases are rare, so the bridge
# tracks the repository rather than a crates.io version. The three crates below are the same
# workspace, which keeps their versions unified. The rev pin is the master HEAD the 0.10.0
# port was built against; bump it deliberately after reviewing upstream changes.
grammers-client = { git = "https://codeberg.org/Lonami/grammers.git", rev = "42d4b51059524cf7c8c9a07745a1071057fa1526", features = ["html", "markdown"] }
grammers-mtsender = { git = "https://codeberg.org/Lonami/grammers.git", rev = "42d4b51059524cf7c8c9a07745a1071057fa1526" }
grammers-session = { git = "https://codeberg.org/Lonami/grammers.git", rev = "42d4b51059524cf7c8c9a07745a1071057fa1526" }
# grammers' search date bounds take a `jiff::Timestamp`, so the bridge carries jiff to build one.
jiff = "0.2"
mime_guess = "2"
jni = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.47.1", features = ["rt-multi-thread"] }
