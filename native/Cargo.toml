[package]
name = "kotlogramme"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "JNI bridge between Kotlin/JVM and the grammers Telegram client"
repository = "https://codeberg.org/kotlogramme/kotlogramme"

[lib]
crate-type = ["cdylib"]

[dependencies]
# grammers is developed on its codeberg repository and releases are rare, so the bridge
# tracks the repository's master branch rather than a crates.io version. The three crates below
# are the same workspace, which keeps their versions unified.
grammers-client = { git = "https://codeberg.org/Lonami/grammers.git", features = ["html", "markdown"] }
grammers-mtsender = { git = "https://codeberg.org/Lonami/grammers.git" }
grammers-session = { git = "https://codeberg.org/Lonami/grammers.git" }
# grammers' search date bounds take a `jiff::Timestamp`, so the bridge carries jiff to build one.
jiff = "0.2"
mime_guess = "2"
jni = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.47.1", features = ["rt-multi-thread"] }
